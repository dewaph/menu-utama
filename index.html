<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24339a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIP Outstanding">
<title>Outstanding Pura Bangunan dan Manika</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eef0f7;
    --surface: #ffffff;
    --text: #161a2e;
    --muted: #5f6580;
    --line: #e1e4ef;
    --hero: #24339a;
    --hero-2: #1a2578;
    --bangunan: #24339a;
    --bangunan-soft: #e6e9fb;
    --manika: #0f766e;
    --manika-soft: #dcf3ef;
    --oksigen: #c2570c;
    --oksigen-soft: #fde9d8;
    --shadow: 0 6px 20px rgba(22, 26, 46, .10);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1120;
    --surface: #1b1f33;
    --text: #eef0f8;
    --muted: #a4abc6;
    --line: #2a2f48;
    --hero: #1a2578;
    --hero-2: #121a5c;
    --bangunan: #8a99ff;
    --bangunan-soft: #262c5c;
    --manika: #4fd1c2;
    --manika-soft: #173d3a;
    --oksigen: #ffa05a;
    --oksigen-soft: #4a2c14;
    --shadow: 0 6px 20px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #menu { min-height: 100%; display: flex; flex-direction: column; }

  .hero {
    background: linear-gradient(160deg, var(--hero), var(--hero-2));
    color: #fff;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 18px;
    border-radius: 0 0 22px 22px;
  }
  .hero-inner { max-width: 520px; margin: 0 auto; }
  .brand-wrap {
    display: inline-block;
    background: #fff;
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    max-width: calc(100% - 60px);
  }
  :root[data-theme="dark"] .brand-wrap { background: #1b1f33; }
  .brand { display: block; height: 24px; width: auto; max-width: 100%; }
  .brand-dark { display: none; }
  :root[data-theme="dark"] .brand-light { display: none; }
  :root[data-theme="dark"] .brand-dark { display: block; }
  .hero h1 { margin: 0; font-size: 1.3rem; line-height: 1.2; letter-spacing: -.01em; }
  .hero p { margin: 4px 0 0; color: rgba(255,255,255,.8); font-size: .9rem; }

  .list {
    max-width: 520px;
    width: 100%;
    margin: 18px auto 0;
    padding: 0 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .choice {
    display: flex; align-items: center; gap: 16px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--shadow);
    font: inherit;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .choice:active { transform: scale(.985); }
  .choice:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
  .icon {
    flex: none;
    width: 58px; height: 58px;
    border-radius: 16px;
    background: var(--soft);
    color: var(--c);
    display: grid; place-items: center;
  }
  .icon svg { width: 30px; height: 30px; }
  .text { flex: 1; min-width: 0; }
  .text strong { display: block; font-size: 1.15rem; letter-spacing: -.01em; }
  .text span { display: block; margin-top: 3px; color: var(--muted); font-size: .92rem; }
  .chev { flex: none; width: 22px; height: 22px; color: var(--muted); }
  #bangunan { --c: var(--bangunan); --soft: var(--bangunan-soft); }
  #manika { --c: var(--manika); --soft: var(--manika-soft); }
  #oksigen { --c: var(--oksigen); --soft: var(--oksigen-soft); }

  .foot {
    margin-top: auto;
    padding: 28px 24px calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
  }

  #viewer {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
  }
  #viewer iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; background: #fff;
    transition: filter .2s ease;
  }
  #home {
    position: fixed;
    right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    z-index: 2147483647;
    border: 0; border-radius: 999px;
    padding: 12px 18px;
    font: inherit; font-weight: 600;
    color: #fff;
    background: var(--hero);
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    cursor: pointer;
  }
  .theme-btn {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: 16px;
    width: 38px; height: 38px;
    border: 0; border-radius: 50%;
    background: rgba(255,255,255,.18);
    color: #fff;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .theme-btn svg { width: 22px; height: 22px; }
  .theme-btn .moon { display: none; }
  :root[data-theme="dark"] .theme-btn .sun { display: none; }
  :root[data-theme="dark"] .theme-btn .moon { display: block; }
  .hero { position: relative; }

  /* Mode gelap hanya untuk menu utama dan Tabung Oksigen */
  :root[data-theme="dark"] body[data-app="oksigen"] #viewer iframe { filter: invert(1) hue-rotate(180deg); background: #111; }
  /* Tombol mode gelap di dalam aplikasi hanya untuk Tabung Oksigen */
  body:not([data-app="oksigen"]) #viewer .theme-btn { display: none; }
  #viewer .theme-btn {
    position: fixed;
    top: auto;
    right: 14px;
    bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    z-index: 2147483647;
    background: var(--hero);
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  body.open #menu { display: none; }
  body.open #viewer { display: block; }
</style>
</head>
<body>
  <main id="menu">
    <header class="hero">
      <button class="theme-btn" type="button" aria-label="Ganti mode terang atau gelap"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="#ffb703" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" fill="#ffd54a"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="#ffe08a" stroke="#ffc933" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <div class="hero-inner">
        <span class="brand-wrap"><img class="brand brand-light" src="pura-group-light.svg" alt="Pura Group"><img class="brand brand-dark" src="pura-group-dark.svg" alt="Pura Group"></span>
        <h1>Outstanding Pura Bangunan dan Manika</h1>
        <p>Pantau barang pesanan dan tabung oksigen.</p>
      </div>
    </header>

    <div class="list">
      <button class="choice" id="bangunan" data-url="https://dewaph.github.io/outstanding-sip-bangunan/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"/><path d="M2 21h20"/><path d="M9 21v-6h6v6"/><path d="M9 10h.01M15 10h.01"/></svg>
        </span>
        <span class="text">
          <strong>Outstanding Bangunan</strong>
          <span>Daftar outstanding bangunan</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <button class="choice" id="manika" data-url="https://dewaph.github.io/outstanding-sip-manika/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-5h4v5"/></svg>
        </span>
        <span class="text">
          <strong>Outstanding Manika</strong>
          <span>Daftar outstanding Manika</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <button class="choice" id="oksigen" data-url="https://dewaph.github.io/tabung-oksigen/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4"/><path d="M12 2v3"/><path d="M8 9a4 4 0 014-4 4 4 0 014 4v11a2 2 0 01-2 2h-4a2 2 0 01-2-2V9z"/><path d="M8 11h8"/></svg>
        </span>
        <span class="text">
          <strong>Tabung Oksigen</strong>
          <span>Pengelolaan tabung dari supplier</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <footer class="foot">Pilih salah satu untuk membuka daftarnya.</footer>
  </main>

  <div id="viewer">
    <iframe id="frame" title="Outstanding SIP" allow="camera; clipboard-write"></iframe>
    <button class="theme-btn" type="button" aria-label="Ganti mode terang atau gelap"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="#ffb703" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" fill="#ffd54a"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="#ffe08a" stroke="#ffc933" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    <button id="home" type="button">Ganti outstanding</button>
  </div>

<script>
  var frame = document.getElementById('frame');
  var home = document.getElementById('home');

  function openApp(btn) {
    frame.src = btn.getAttribute('data-url');
    document.body.setAttribute('data-app', btn.id);
    document.body.classList.add('open');
    history.pushState({ open: true }, '');
  }
  function closeApp() {
    document.body.classList.remove('open');
    document.body.removeAttribute('data-app');
    frame.src = 'about:blank';
  }

  document.querySelectorAll('.choice').forEach(function (b) {
    b.addEventListener('click', function () { openApp(b); });
  });
  // Sekali klik langsung kembali ke menu utama
  home.addEventListener('click', function () {
    closeApp();
    history.replaceState({}, '');
  });
  // Tombol Back di HP kembali ke menu pilihan
  window.addEventListener('popstate', closeApp);

  // Mode terang / gelap
  var root = document.documentElement;
  var meta = document.querySelector('meta[name="theme-color"]');
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    if (meta) meta.setAttribute('content', t === 'dark' ? '#121a5c' : '#24339a');
  }
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  applyTheme(saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  document.querySelectorAll('.theme-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  });
</script>
</body>
</html>
